# MkDocs configuration for https://metatrader-docker.blunan.com/.
site_name: metatrader-docker
site_description: MetaTrader in your browser, in a hardened container.
site_url: https://metatrader-docker.blunan.com/
repo_url: https://github.com/blunan/metatrader-docker
repo_name: blunan/metatrader-docker
edit_uri: ""
copyright: Copyright &copy; 2026 Brayan Luna &middot; GPL-3.0
exclude_docs: |
  requirements.*

theme:
  name: material
  font: false                                  # system fonts (no Google Fonts requests)
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Follow the system setting
  features:
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started:
      - Quick start: quick-start.md
      - Access and reverse proxy: access.md
      - Folders and settings: settings.md
  - Using and running:
      - Using MetaTrader: using.md
      - Operations and updates: operations.md
      - Troubleshooting: troubleshooting.md
  - Reference:
      - Security and verification: verify.md
      - Build it yourself: building.md
