# A local build of the image, run with the example's settings, next to a real
# deployment on the same machine: its own project name, ports, folders and
# password, so nothing here touches the real one. On top of the example:
#   docker compose -f compose.yaml -f tests/compose.dev.yaml build
#   docker compose -f compose.yaml -f tests/compose.dev.yaml up -d demo
# Paths are relative to the first file's folder, the repository's root.
# mem_limit stays the example's 4g, so tests see what users get.
name: mt5-dev

x-dev: &dev
  image: mt5-desktop:dev
  build: .
  restart: "no"                                # a test run doesn't come back after a reboot

services:
  demo:
    <<: *dev
    environment:
      TITLE: MT5 dev demo
    volumes:
      - ./data/dev-demo:/config
      - ./data/dev-ea:/mql5
    ports: !override
      - "127.0.0.1:3201:3001"

  live:
    <<: *dev
    environment:
      TITLE: MT5 dev live
    volumes:
      - ./data/dev-live:/config
      - ./data/dev-ea:/mql5:ro
    ports: !override
      - "127.0.0.1:3301:3001"

secrets:
  demo_password:
    file: ./secrets/dev_password
  live_password:
    file: ./secrets/dev_password
