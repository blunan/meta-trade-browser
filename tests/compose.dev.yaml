# A local build of the image, run with the example's settings, next to a real
# deployment on the same machine: its own project name, container name, port,
# folders and password, so nothing here touches the real one. On top of the
# example:
#   docker compose -f compose.yaml -f tests/compose.dev.yaml build
#   docker compose -f compose.yaml -f tests/compose.dev.yaml up -d
# With MT_PYTHON=true in front of the second command, it installs Python too.
# Paths are relative to the first file's folder, the repository's root.
# mem_limit stays the example's 4g, so tests see what users get.
name: mt-dev

services:
  metatrader-docker:
    image: metatrader-docker:dev
    build: .
    container_name: metatrader-docker-dev
    restart: "no"                              # a test run doesn't come back after a reboot
    environment:
      TITLE: MetaTrader dev
      MT_PYTHON: ${MT_PYTHON:-}                # empty: off
    volumes:
      - ./dev/data:/config
      - ./dev/ea:/mql5
    ports: !override
      - "127.0.0.1:3201:3001"

secrets:
  password:
    file: ./dev/secrets/dev_password
