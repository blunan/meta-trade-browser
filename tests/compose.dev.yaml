# Overlay compose configuration for local development and testing:
#   docker compose -f compose.yaml -f tests/compose.dev.yaml build
#   [MT_PYTHON=true] docker compose -f compose.yaml -f tests/compose.dev.yaml up -d
name: mt-dev

services:
  metatrader-docker:
    image: metatrader-docker:dev
    build: .
    container_name: metatrader-docker-dev
    restart: "no"
    environment:
      TITLE: MetaTrader dev
      MT_PYTHON: ${MT_PYTHON:-}                # empty: off
    volumes:
      - ./dev/data:/config
      - ./dev/ea:/mql5
    ports: !override
      - "127.0.0.1:3201:3001"

secrets:
  password:
    file: ./dev/secrets/dev_password
