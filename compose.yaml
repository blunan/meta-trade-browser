# mt5-desktop: an example deployment, one container for one trading account.
# The README's quick start creates the folders and the password file it needs
# before the first start.
name: mt5

services:
  desktop:
    image: ghcr.io/blunan/mt5-desktop:latest   # or a date tag such as :20261019, to stay on one build
    restart: unless-stopped
    stop_grace_period: 30s                     # time for MT5 to save its charts and settings
    # Never add init: true. The image's own supervisor (s6) has to be process 1,
    # and with Docker's init the container stops at once.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL]   # the desktop's startup needs all six
    shm_size: 1gb
    pids_limit: 2048
    mem_limit: 4g                              # an open HTML pane (Help, Market) can reach this; Edge is stopped first, not MT5. 6g for heavy use of the panes
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"
    environment:
      PUID: "1000"                             # the user that owns ./data/desktop and ./ea on the host
      PGID: "1000"
      FILE__PASSWORD: /run/secrets/password
    secrets: [password]
    volumes:
      - ./data/desktop:/config                 # bind mount: survives docker system prune --volumes
      - ./ea:/mql5                             # optional: your EAs, indicators and scripts
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3001:3001"

secrets:
  # One password in the file, at least 12 characters. Make the file root's, so
  # nothing inside the desktop can read it:
  #   sudo chown root:root secrets/password && sudo chmod 0400 secrets/password
  password: { file: ./secrets/password }
