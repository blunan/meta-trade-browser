# Builds, tests and scans the image on every PR. On main it also pushes the
# tested image to GHCR, signs its digest with cosign (keyless, as this
# workflow), and only then tags it. "Image tests" is a required check, so it
# reports on every PR; when a PR doesn't touch the image, it skips the image's
# steps and passes in seconds.
name: image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - root/**
      - tests/**
      - .trivyignore.yaml
      - .github/workflows/image.yml
  pull_request:
  schedule:
    - cron: "0 6 * * 1"                        # Mondays: Debian's and the base's updates
  workflow_dispatch:

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/blunan/mt-browser
  IDENTITY: https://github.com/blunan/mt-browser/.github/workflows/image.yml@refs/heads/main
  ISSUER: https://token.actions.githubusercontent.com
  # renovate: datasource=github-releases depName=sigstore/cosign
  COSIGN_VERSION: v3.1.3
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: v0.75.0

jobs:
  test:
    name: Image tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      created: ${{ steps.meta.outputs.created }}
      layers: ${{ steps.layers.outputs.layers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0                       # the PR's base commit, for the diff below

      - name: Does this change the image?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT" != pull_request ]]; then
            echo "image=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE...HEAD")"
          printf '%s\n' "$changed"
          if grep -q -E '^(Dockerfile|root/|tests/|\.trivyignore\.yaml|\.github/workflows/image\.yml)' <<< "$changed"; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
            echo "This PR doesn't change the image, so its build, tests and scan are skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Free disk space                  # the image takes about 10 GB while it builds
        if: steps.changes.outputs.image == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
          df -h /

      - name: shellcheck
        if: steps.changes.outputs.image == 'true'
        run: |
          shellcheck --version | sed -n 2p
          mapfile -t scripts < <(git ls-files | while read -r f; do
            head -n 1 "$f" | grep -q -E '^#!.*[/ ](ba)?sh$' && printf '%s\n' "$f"
          done)
          printf '%s\n' "${scripts[@]}"
          shellcheck "${scripts[@]}"

      - name: Version values, shared with the publish job
        id: meta
        run: |
          echo "version=$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.changes.outputs.image == 'true'

      # The weekly build starts from scratch, so apt-get upgrade really runs.
      # The publish job rebuilds from this build's cache.
      - name: Build
        if: steps.changes.outputs.image == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: mt-browser:ci
          provenance: false
          sbom: false
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}
          build-args: |
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_CREATED=${{ steps.meta.outputs.created }}

      - name: Layers of the tested image
        id: layers
        if: steps.changes.outputs.image == 'true'
        run: |
          layers="$(docker image inspect mt-browser:ci --format '{{json .RootFS.Layers}}' | jq -c .)"
          jq -r '.[]' <<< "$layers"
          echo "layers=$layers" >> "$GITHUB_OUTPUT"

      - name: Access tests (T1–T20)
        if: steps.changes.outputs.image == 'true'
        run: tests/access.sh --host mt-browser:ci

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.changes.outputs.image == 'true'
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # Never trivy-action or setup-trivy by tag: their tags were hijacked in
      # March 2026. The release is checked against Trivy's own release workflow.
      - name: Install Trivy, checked with cosign
        if: steps.changes.outputs.image == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          file="trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz"
          base="https://github.com/aquasecurity/trivy/releases/download/$TRIVY_VERSION"
          curl -fsSLO "$base/$file"
          curl -fsSLO "$base/$file.sigstore.json"
          cosign verify-blob --bundle "$file.sigstore.json" \
            --certificate-identity "https://github.com/aquasecurity/trivy/.github/workflows/reusable-release.yaml@refs/tags/$TRIVY_VERSION" \
            --certificate-oidc-issuer "$ISSUER" "$file"
          tar -xzf "$file" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          trivy --version

      - name: Today's date, for Trivy's database cache
        id: day
        if: steps.changes.outputs.image == 'true'
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.changes.outputs.image == 'true'
        with:
          path: ~/.cache/trivy/db
          key: trivy-db-${{ steps.day.outputs.day }}
          restore-keys: trivy-db-

      - name: Trivy
        if: steps.changes.outputs.image == 'true'
        run: |
          trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            --scanners vuln,secret --ignorefile .trivyignore.yaml mt-browser:ci

  publish:
    name: Publish
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write                          # keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same build, from the test job's cache, pushed by digest: no tag
      # points to it until it's checked and signed.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          build-args: |
            IMAGE_VERSION=${{ needs.test.outputs.version }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_CREATED=${{ needs.test.outputs.created }}

      - name: The pushed image is the tested one
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TESTED: ${{ needs.test.outputs.layers }}
        run: |
          pushed="$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json .Image}}' |
            jq -c 'if has("rootfs") then .rootfs.diff_ids else .["linux/amd64"].rootfs.diff_ids end')"
          if [[ "$pushed" != "$(jq -c . <<< "$TESTED")" ]]; then
            echo "The pushed image's layers differ from the tested image's:" >&2
            diff <(jq -r '.[]' <<< "$TESTED") <(jq -r '.[]' <<< "$pushed") >&2 || true
            exit 1
          fi
          echo "Same $(jq length <<< "$pushed") layers as the tested image."

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign the digest, then check the signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify "$IMAGE@$DIGEST" --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" > /dev/null

      # latest moves; a date tag never does (a second build that day gets .2);
      # sha-<commit> names the first build of that commit.
      - name: Tag
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          exists() { docker buildx imagetools inspect "$IMAGE:$1" > /dev/null 2>&1; }
          day="$(date -u +%Y%m%d)"
          date_tag="$day"
          n=1
          while exists "$date_tag"; do
            n=$((n + 1))
            date_tag="$day.$n"
          done
          tags=(latest "$date_tag")
          exists "sha-${GITHUB_SHA::7}" || tags+=("sha-${GITHUB_SHA::7}")
          args=()
          for tag in "${tags[@]}"; do args+=(-t "$IMAGE:$tag"); done
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
          for tag in "${tags[@]}"; do
            got="$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' | jq -r .digest)"
            [[ "$got" == "$DIGEST" ]] || { echo "$tag points to $got, not $DIGEST" >&2; exit 1; }
          done
          listed=""
          for tag in "${tags[@]}"; do listed+="\`$tag\` "; done
          {
            echo "### Published $IMAGE"
            echo
            echo "- Digest: \`$DIGEST\`"
            echo "- Tags: $listed"
            echo
            echo '```sh'
            echo "cosign verify $IMAGE@$DIGEST \\"
            echo "  --certificate-identity $IDENTITY \\"
            echo "  --certificate-oidc-issuer $ISSUER"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
