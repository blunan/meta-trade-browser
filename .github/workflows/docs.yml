# Builds the guide from docs/ and publishes it to GitHub Pages, at
# https://mt-browser.blunan.com/ (the domain is set in the repository's Pages
# settings, not in a CNAME file). Pull requests only build and check it.
name: docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - compose.yaml
      - README.md
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - compose.yaml
      - README.md
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the locked packages
        run: pip install --require-hashes -r docs/requirements.txt

      # The README shows compose.yaml inline; the guide includes the file itself.
      - name: Check the README's compose.yaml against the file
        run: awk '/^```yaml$/ { f = 1; next } /^```$/ { if (f) exit } f' README.md | diff -u compose.yaml -

      - name: Build the guide
        run: mkdocs build --strict

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
